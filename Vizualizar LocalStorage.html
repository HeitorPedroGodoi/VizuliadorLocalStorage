<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de LocalStorage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #333;
    }

    table {
      width: 90%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 1rem;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
      word-break: break-all;
    }

    th {
      background: #0078d7;
      color: white;
    }

    button {
      background: #0078d7;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      margin: 3px;
      font-size: 14px;
    }

    button:hover {
      background: #005ea6;
    }

    .delete-btn {
      background: #e53935;
    }

    .delete-btn:hover {
      background: #c62828;
    }

    .empty {
      margin-top: 20px;
      color: #666;
      font-style: italic;
    }

    /* Área abaixo da tabela */
    #detalhes {
      margin-top: 2rem;
      width: 90%;
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: none;
    }

    #detalhes h2 {
      margin-top: 0;
      color: #0078d7;
    }

    #detalhes pre {
      background: #f3f3f3;
      padding: 10px;
      border-radius: 5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>Visualizador de LocalStorage</h1>
  <button onclick="carregarLocalStorage()">Recarregar</button>

  <table id="tabela">
    <thead>
      <tr>
        <th>Chave</th>
        <th>Valor (máx. 50 caracteres)</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
    </tbody>
  </table>

  <p id="mensagem" class="empty"></p>

  <div id="detalhes">
    <h2 id="detalhes-titulo"></h2>
    <p id="detalhes-info"></p>
    <pre id="detalhes-texto"></pre>
  </div>

  <script>
    function carregarLocalStorage() {
      const tabela = document.getElementById("corpo-tabela");
      const mensagem = document.getElementById("mensagem");
      const detalhes = document.getElementById("detalhes");
      tabela.innerHTML = "";
      mensagem.textContent = "";
      detalhes.style.display = "none";

      if (localStorage.length === 0) {
        mensagem.textContent = "O localStorage está vazio.";
        return;
      }

      for (let i = 0; i < localStorage.length; i++) {
        const chave = localStorage.key(i);
        const valor = localStorage.getItem(chave);
        const valorCurto = valor.length > 50 ? valor.substring(0, 50) + "..." : valor;

        const linha = document.createElement("tr");
        linha.innerHTML = `
          <td>${chave}</td>
          <td>${valorCurto}</td>
          <td>
            <button onclick="mostrarConteudo('${chave}')">📏 Ver conteúdo</button>
            <button class="delete-btn" onclick="apagarItem('${chave}')">🗑️ Apagar</button>
          </td>
        `;
        tabela.appendChild(linha);
      }
    }

    function apagarItem(chave) {
      if (confirm(`Deseja realmente apagar "${chave}"?`)) {
        localStorage.removeItem(chave);
        carregarLocalStorage();
      }
    }

    function mostrarConteudo(chave) {
      const valor = localStorage.getItem(chave);
      if (!valor) return;

      const tamanhoChar = valor.length;
      const tamanhoBytes = new Blob([valor/1000]).size;

      document.getElementById("detalhes-titulo").textContent = `Chave: ${chave}`;
      document.getElementById("detalhes-info").textContent =
        `Tamanho: ${tamanhoChar} caracteres (${tamanhoBytes} kilobytes aproximadamente)`;
      document.getElementById("detalhes-texto").textContent = valor;

      document.getElementById("detalhes").style.display = "block";
      document.getElementById("detalhes").scrollIntoView({ behavior: "smooth" });
    }

    // Carregar ao abrir
    carregarLocalStorage();
  </script>

</body>
</html>
